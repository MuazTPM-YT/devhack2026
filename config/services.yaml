# Single list of shop services (plan §4.1, contract C7).
# Names are the real Deployment names in namespace "shop" (chart 0.42.6).
services:
  payment:        {kind: stateless, critical: true,  actable: true}
  checkout:       {kind: stateless, critical: true,  actable: true}
  cart:           {kind: stateless, critical: true,  actable: true}
  frontend:       {kind: stateless, critical: true,  actable: true}
  recommendation: {kind: stateless, critical: false, actable: true}
  ad:             {kind: stateless, critical: false, actable: true}
  email:          {kind: stateless, critical: false, actable: true}
  valkey-cart:    {kind: stateful,  critical: true,  protected: true}
  kafka:          {kind: stateful,  critical: true,  protected: true}
flag_config:
  # flagd reads this ConfigMap directly (k8s/values.yaml) and reloads ~60 s after a patch;
  # flagd-ui edits do not reach flagd
  configmap: flagd-config
# flag -> service whose behaviour it changes (from each flag's description in flagd-config).
# Lets a `flag` journal entry on flagd-config be linked to the culprit. Not listed: emitRawPii
# (not a failure) and aiRunawayAgent / aiSlowResponse (the agent service is disabled).
flags:
  adFailure: ad
  adHighCpu: ad
  adManualGc: ad
  cartFailure: cart
  emailMemoryLeak: email
  failedReadinessProbe: cart
  imageSlowLoad: frontend
  intlShippingSlowdown: shipping
  kafkaQueueProblems: kafka
  loadGeneratorFloodHomepage: frontend
  paymentFailure: payment
  paymentUnreachable: checkout
  productCatalogFailure: product-catalog
  productCatalogLockContention: product-catalog
  recommendationCacheFailure: recommendation
degraded_mode_flags:               # non-critical features that can be switched off
  - recommendation
  - ad
