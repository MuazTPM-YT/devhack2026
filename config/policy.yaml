# Gateway and observer policy (IMPLEMENTATION.md §4.2). Deterministic code reads this; the LLM never does.
detection:
  error_ratio_threshold: 0.05
  latency_multiplier: 2.0
  latency_floor_ms: 100            # and p95 at least this far above baseline (recommendation: 4.8 ms base)
  sustain_seconds: 30
  poll_seconds: 5
  # an incident nobody ended (lost terminal event, crashed process) is closed and escalated after this;
  # above the longest real path: 3 fixes, each diagnose (150 s) + approval (300 s) + verify (120 + 90 s for a flag)
  incident_max_age_seconds: 2400
  # an incident the brain never handed to the gateway (brain crashed mid-diagnosis) is escalated after this;
  # above one diagnosis: agent run (150 s) + its reads
  handover_seconds: 600
change_window_minutes: 10          # "recent change" window before onset
budgets:
  max_actions_per_incident: 3
  max_actions_per_hour: 3
  max_in_flight: 1
  max_retries: 2                   # after a clean undo, up to 2 more fixes: 3 per incident (Muaz chose)
tools:
  rollback_deploy:      {reversible: true, auto_eligible: true}
  revert_config:        {reversible: true, auto_eligible: true}
  restart_service:      {reversible: true, auto_eligible: stateless_only}
  scale:                {reversible: true, auto_eligible: true, min: 1, max: 3}
  raise_limit:          {reversible: true, auto_eligible: false, max_memory: 1Gi}
  enable_degraded_mode: {reversible: true, auto_eligible: true}
autonomy:
  # Exact journal inverses only: flag/env reverts or restoring a reduced replica count.
  # No incident-time approval on these non-critical services; all other checks still run.
  journal_reverts: [ad, email, recommendation]
  # Restore a lowered memory cap exactly; general memory increases still need approval.
  memory_restores: [ad, email, recommendation]
net_benefit:
  max_added_harm_seconds: 30       # per healthy critical service
  min_benefit_ratio: 2.0           # harm removed must be at least 2x harm added
trust:
  confidence: 0.95
  bar: 0.90                        # hackathon; production is 0.95
  reset_on_failure: true
verify:
  window_seconds: 120
  flag_extra_seconds: 90          # flagd reloads a ConfigMap edit after ~60 s (A, live)
  early_abort: true
  early_abort_grace_seconds: 60   # checkout turns sick seconds after payment (A, live)
major_incident:
  min_services: 3                  # kafka down sickens checkout, accounting, fraud-detection (Muaz)
  min_fraction: 0.30
  within_seconds: 120
approval:
  expiry_seconds: 300
  repage_seconds: 120
  approvers_env: ONCALL_APPROVER_IDS   # ids live in .env, never in git
