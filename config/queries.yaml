# Allow-listed PromQL templates (IMPLEMENTATION.md §4.3). Brain and gateway may run only these.
# $service is the only placeholder; callers must pass a name from config/services.yaml.
# Metric names traces_span_metrics_calls_total, traces_span_metrics_duration_milliseconds_bucket and labels
# service_name, status_code checked against the live Prometheus (chart 0.42.6, §3.3).
err_ratio: >
  sum(rate(traces_span_metrics_calls_total{service_name="$service",status_code="STATUS_CODE_ERROR"}[1m]))
  / sum(rate(traces_span_metrics_calls_total{service_name="$service"}[1m]))
p95_ms: >
  histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="$service"}[1m])))
err_ratio_all: >
  sum by (service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[1m]))
  / sum by (service_name) (rate(traces_span_metrics_calls_total[1m]))
p95_ms_all: >
  histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket[1m])))
