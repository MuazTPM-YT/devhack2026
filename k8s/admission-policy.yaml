# Field limits on the agent's writes (IMPLEMENTATION.md §6.5.3). Applies only to the oncall-agent SA.
# CEL errors on missing fields, and failurePolicy Fail turns an error into a deny, so every
# optional field uses: has(new) == has(old) && (!has(new) || new == old).
# VERIFY: image prefixes against the real shop images (A, §3.3).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oncall-agent-fields}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["deployments"]
  matchConditions:
  - name: only-the-agent
    expression: "request.userInfo.username == 'system:serviceaccount:shop:oncall-agent'"
  variables:
  - name: new
    expression: "object.spec.template.spec"
  - name: old
    expression: "oldObject.spec.template.spec"
  validations:
  - message: "agent may not change the service account"
    expression: >-
      has(variables.new.serviceAccountName) == has(variables.old.serviceAccountName)
      && (!has(variables.new.serviceAccountName) || variables.new.serviceAccountName == variables.old.serviceAccountName)
      && has(variables.new.serviceAccount) == has(variables.old.serviceAccount)
      && (!has(variables.new.serviceAccount) || variables.new.serviceAccount == variables.old.serviceAccount)
  - message: "agent may not change volumes"
    expression: >-
      has(variables.new.volumes) == has(variables.old.volumes)
      && (!has(variables.new.volumes) || variables.new.volumes == variables.old.volumes)
  - message: "agent may not change the pod securityContext"
    expression: >-
      has(variables.new.securityContext) == has(variables.old.securityContext)
      && (!has(variables.new.securityContext) || variables.new.securityContext == variables.old.securityContext)
  - message: "agent may not change hostNetwork, hostPID or hostIPC"
    expression: >-
      has(variables.new.hostNetwork) == has(variables.old.hostNetwork)
      && (!has(variables.new.hostNetwork) || variables.new.hostNetwork == variables.old.hostNetwork)
      && has(variables.new.hostPID) == has(variables.old.hostPID)
      && (!has(variables.new.hostPID) || variables.new.hostPID == variables.old.hostPID)
      && has(variables.new.hostIPC) == has(variables.old.hostIPC)
      && (!has(variables.new.hostIPC) || variables.new.hostIPC == variables.old.hostIPC)
  - message: "agent may not change initContainers"
    expression: >-
      has(variables.new.initContainers) == has(variables.old.initContainers)
      && (!has(variables.new.initContainers) || variables.new.initContainers == variables.old.initContainers)
  - message: "agent may not add containers or change commands, args or container securityContext"
    expression: >-
      variables.new.containers.all(c, variables.old.containers.exists(o, o.name == c.name
        && has(c.command) == has(o.command) && (!has(c.command) || c.command == o.command)
        && has(c.args) == has(o.args) && (!has(c.args) || c.args == o.args)
        && has(c.securityContext) == has(o.securityContext)
        && (!has(c.securityContext) || c.securityContext == o.securityContext)))
  - message: "agent may not change scheduling, the service account token or other pod settings"
    expression: >-
      has(variables.new.nodeSelector) == has(variables.old.nodeSelector) && (!has(variables.new.nodeSelector) || variables.new.nodeSelector == variables.old.nodeSelector)
      && has(variables.new.tolerations) == has(variables.old.tolerations) && (!has(variables.new.tolerations) || variables.new.tolerations == variables.old.tolerations)
      && has(variables.new.affinity) == has(variables.old.affinity) && (!has(variables.new.affinity) || variables.new.affinity == variables.old.affinity)
      && has(variables.new.nodeName) == has(variables.old.nodeName) && (!has(variables.new.nodeName) || variables.new.nodeName == variables.old.nodeName)
      && has(variables.new.automountServiceAccountToken) == has(variables.old.automountServiceAccountToken) && (!has(variables.new.automountServiceAccountToken) || variables.new.automountServiceAccountToken == variables.old.automountServiceAccountToken)
      && has(variables.new.priorityClassName) == has(variables.old.priorityClassName) && (!has(variables.new.priorityClassName) || variables.new.priorityClassName == variables.old.priorityClassName)
      && has(variables.new.runtimeClassName) == has(variables.old.runtimeClassName) && (!has(variables.new.runtimeClassName) || variables.new.runtimeClassName == variables.old.runtimeClassName)
      && has(variables.new.hostAliases) == has(variables.old.hostAliases) && (!has(variables.new.hostAliases) || variables.new.hostAliases == variables.old.hostAliases)
      && has(variables.new.shareProcessNamespace) == has(variables.old.shareProcessNamespace) && (!has(variables.new.shareProcessNamespace) || variables.new.shareProcessNamespace == variables.old.shareProcessNamespace)
      && has(variables.new.imagePullSecrets) == has(variables.old.imagePullSecrets) && (!has(variables.new.imagePullSecrets) || variables.new.imagePullSecrets == variables.old.imagePullSecrets)
      && has(variables.new.dnsConfig) == has(variables.old.dnsConfig) && (!has(variables.new.dnsConfig) || variables.new.dnsConfig == variables.old.dnsConfig)
      && has(variables.new.dnsPolicy) == has(variables.old.dnsPolicy) && (!has(variables.new.dnsPolicy) || variables.new.dnsPolicy == variables.old.dnsPolicy)
  - message: "agent may not change probes, lifecycle hooks, envFrom, ports, mounts or workingDir"
    expression: >-
      variables.new.containers.all(c, variables.old.containers.exists(o, o.name == c.name
        && has(c.livenessProbe) == has(o.livenessProbe) && (!has(c.livenessProbe) || c.livenessProbe == o.livenessProbe)
        && has(c.readinessProbe) == has(o.readinessProbe) && (!has(c.readinessProbe) || c.readinessProbe == o.readinessProbe)
        && has(c.startupProbe) == has(o.startupProbe) && (!has(c.startupProbe) || c.startupProbe == o.startupProbe)
        && has(c.lifecycle) == has(o.lifecycle) && (!has(c.lifecycle) || c.lifecycle == o.lifecycle)
        && has(c.envFrom) == has(o.envFrom) && (!has(c.envFrom) || c.envFrom == o.envFrom)
        && has(c.ports) == has(o.ports) && (!has(c.ports) || c.ports == o.ports)
        && has(c.volumeMounts) == has(o.volumeMounts) && (!has(c.volumeMounts) || c.volumeMounts == o.volumeMounts)
        && has(c.workingDir) == has(o.workingDir) && (!has(c.workingDir) || c.workingDir == o.workingDir)))
  - message: "agent may not add env values read from secrets or configmaps"
    expression: >-
      variables.new.containers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom)
        || variables.old.containers.exists(o, o.name == c.name && has(o.env) && e in o.env)))
  - message: "memory limit above 1Gi"
    expression: >-
      variables.new.containers.all(c, !has(c.resources) || !has(c.resources.limits)
        || !('memory' in c.resources.limits)
        || quantity(c.resources.limits['memory']).compareTo(quantity('1Gi')) <= 0
        || variables.old.containers.exists(o, o.name == c.name && has(o.resources) && has(o.resources.limits)
             && 'memory' in o.resources.limits && o.resources.limits['memory'] == c.resources.limits['memory']))
  - message: "agent may not change pod labels"
    expression: >-
      has(object.spec.template.metadata.labels) == has(oldObject.spec.template.metadata.labels)
      && (!has(object.spec.template.metadata.labels)
          || object.spec.template.metadata.labels == oldObject.spec.template.metadata.labels)
  - message: "agent may not change the rollout strategy or revision history"
    expression: >-
      has(object.spec.strategy) == has(oldObject.spec.strategy) && (!has(object.spec.strategy) || object.spec.strategy == oldObject.spec.strategy)
      && has(object.spec.revisionHistoryLimit) == has(oldObject.spec.revisionHistoryLimit) && (!has(object.spec.revisionHistoryLimit) || object.spec.revisionHistoryLimit == oldObject.spec.revisionHistoryLimit)
      && has(object.spec.minReadySeconds) == has(oldObject.spec.minReadySeconds) && (!has(object.spec.minReadySeconds) || object.spec.minReadySeconds == oldObject.spec.minReadySeconds)
      && has(object.spec.progressDeadlineSeconds) == has(oldObject.spec.progressDeadlineSeconds) && (!has(object.spec.progressDeadlineSeconds) || object.spec.progressDeadlineSeconds == oldObject.spec.progressDeadlineSeconds)
  - message: "image must come from an approved source"
    expression: >-
      variables.new.containers.all(c,
        c.image.startsWith('ghcr.io/open-telemetry/demo:') || c.image.startsWith('payment:'))
  - message: "replicas must stay between 1 and 3"
    expression: "!has(object.spec.replicas) || (object.spec.replicas >= 1 && object.spec.replicas <= 3)"
---
# The scale subresource skips the policy above, so bound replicas here too.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oncall-agent-scale}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["deployments/scale"]
  matchConditions:
  - name: only-the-agent
    expression: "request.userInfo.username == 'system:serviceaccount:shop:oncall-agent'"
  validations:
  - message: "replicas must stay between 1 and 3"
    expression: "has(object.spec.replicas) && object.spec.replicas >= 1 && object.spec.replicas <= 3"
---
# flagd-config: the agent may change the flag file's text only, never add keys or binary data
# ponytail: CEL cannot parse the JSON, so which flags move is checked in the gateway (dry-run diff), not here
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oncall-agent-flags}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["configmaps"]
  matchConditions:
  - name: only-the-agent
    expression: "request.userInfo.username == 'system:serviceaccount:shop:oncall-agent'"
  validations:
  - message: "agent may change only existing keys of the flag file"
    expression: >-
      has(object.data) && has(oldObject.data) && object.data.size() == oldObject.data.size()
      && oldObject.data.all(k, k in object.data)
      && has(object.binaryData) == has(oldObject.binaryData)
      && (!has(object.binaryData) || object.binaryData == oldObject.binaryData)
