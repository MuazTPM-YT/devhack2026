[project]
name = "oncall-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi~=0.115.12",
  "pydantic~=2.14.1",
  "httpx~=0.28.1",
  "discord.py~=2.5.2",
  "uvicorn~=0.34.3",
  "kubernetes~=36.0.3",
  "pyyaml~=6.0.3",
  "mcp~=1.30.0",
]

[dependency-groups]
dev = ["pytest~=8.4.2", "pytest-asyncio~=1.2.0", "ruff~=0.14.4", "mypy~=1.18.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
exclude-newer = "2026-10-29T00:00:00Z"
